geodata-mode: true
# MetaCubeX 完整规则库
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb
geo-auto-update: true
geo-update-interval: 24
ntp:
  enable: false
sniffer:
  enable: false
# 反广告规则，采用anti-ad库，每24h更新
rule-providers:
  anti-ad:
    type: http
    behavior: domain
    format: mrs
    url: https://anti-ad.net/mihomo.mrs
    interval: 86400
  academic-tools:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/tripper-kevin/clash-config/main/rules/AcademicTools.yaml
    interval: 86400
#DNS规则，适配清华校园网
dns:
  enable: true
  listen: 127.0.0.1:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: 2001:2::0/64
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: false
  use-hosts: true
  use-system-hosts: true
  ipv6: true
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.arpa'
    - time.*.com
    - ntp.*.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.tsinghua.edu.cn
    - +.qq.com
    - rule-set:anti-ad
  default-nameserver:
    - system
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  direct-nameserver:
    - system
  nameserver-policy:
    rule-set:anti-ad: rcode://name_error
    +.tsinghua.edu.cn:
      - system
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ⚡ 自动选择
      - 🔄 故障转移
    include-all: true
    exclude-type: direct
    exclude-filter: &exclude (?i)(流量|剩余|到期|过期|套餐|订阅|官网|公告|客服|群组|网址|更新|重置|重启|维护|工单|邮箱|低倍率|[|｜]\s*0\.\d+|0\.\d+\s*(?:倍(?:率)?|[x×])|(?:倍(?:率)?|[x×])\s*[:：]?\s*0\.\d+)

  # 业务策略组
  - name: 🤖 人工智能
    type: select
    proxies:
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
  - name: 💻 软件开发
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
  - name: 💬 通信社交
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
  - name: 🎬 流媒体
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
  - name: 📖 学术资源
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
      - DIRECT
  - name: 📚 科研工具
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
  - name: 🎮 游戏平台
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
      - DIRECT
  - name: 🌐 Google
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
  - name: 🍎 Apple
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
      - DIRECT
  - name: Ⓜ️ Microsoft
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
      - DIRECT
  - name: 🐟 其他
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 🚀 节点选择
      - DIRECT

  # 地区自动组（共用自动组选项）
  - name: 🇭🇰 香港
    <<: &auto
      type: url-test
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      interval: 600
      timeout: 5000
      tolerance: 100
      max-failed-times: 3
      empty-fallback: REJECT
      lazy: true
      include-all: true
      exclude-type: direct
      exclude-filter: *exclude
    filter: (?i)(香港|🇭🇰|\bHK\b|Hong ?Kong|HKT)

  - name: 🇨🇳 台湾
    <<: *auto
    filter: (?i)(台湾|台灣|臺灣|台北|臺北|高雄|🇹🇼|\bTW\b|Taiwan|Taipei|Kaohsiung)
  - name: 🇯🇵 日本
    <<: *auto
    filter: (?i)(日本|🇯🇵|\bJP\b|Japan|Tokyo|Osaka|Saitama|Nagoya)

  - name: 🇸🇬 新加坡
    <<: *auto
    filter: (?i)(新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)

  - name: 🇺🇸 美国
    <<: *auto
    filter: (?i)(美国|美國|🇺🇸|\bUS\b|\bUSA\b|United ?States|Los ?Angeles|San ?Jose|Seattle|Dallas|New ?York|Chicago|Ashburn)

  # 全局自动选择
  - name: ⚡ 自动选择
    <<: *auto
    # 按节点名称纳入香港、台湾、日本、新加坡。
    filter: (?i)(香港|🇭🇰|\bHK\b|Hong ?Kong|HKT|台湾|台灣|臺灣|台北|臺北|高雄|🇹🇼|\bTW\b|Taiwan|Taipei|Kaohsiung|日本|🇯🇵|\bJP\b|Japan|Tokyo|Osaka|Saitama|Nagoya|新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)
    hidden: true

  # 故障转移
  - name: 🔄 故障转移
    type: fallback
    proxies:
      - 🇭🇰 香港
      - 🇨🇳 台湾
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 600
    timeout: 5000
    max-failed-times: 3
    lazy: true
    hidden: true

