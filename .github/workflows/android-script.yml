name: Generate Android override script

on:
  push:
    branches: [main]
    paths:
      - Merge.yaml
      - scripts/generate_android_script.py
      - android-tests/**
      - .github/workflows/android-script.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-android-override
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install PyYAML==6.0.2
      - name: Generate, test and commit Android script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/generate_android_script.py
            node --check Merge-Android.js
            python -m unittest discover -s android-tests -v
            git add -- Merge-Android.js
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'chore: sync Android override from Merge.yaml'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Push failed. Check branch permissions or rerun the workflow.' >&2
          exit 1
